<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Rescue my clients</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14212b;--muted:#5d6b7a;--line:#dde2e8;--teal:#0f6e6e;--gold:#c9a227;--danger:#b3261e;--ok:#11603a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#17222d;--ink:#e8eef4;--muted:#9aa8b6;--line:#2a3846;--teal:#5fc4c4;--ok:#8fe0b5;--danger:#f08a80}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;padding:16px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:600 1.4rem Georgia,serif;margin:0;color:var(--teal)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.big{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}
button,a.btn{display:block;width:100%;box-sizing:border-box;text-align:center;padding:14px;border:0;border-radius:12px;font:700 1rem inherit;cursor:pointer;text-decoration:none}
.primary{background:var(--gold);color:#1a1405}.secondary{background:var(--teal);color:#fff}
.muted{color:var(--muted);font-size:.9rem}ul{margin:6px 0 0;padding-left:20px}
.ok{color:var(--ok);font-weight:700}.err{color:var(--danger);font-weight:700}
</style></head><body><main>
<h1>Rescue my clients</h1>
<div class="card" id="found"><p class="muted">Checking this device…</p></div>
<button class="primary" id="sendBtn" hidden>Copy them into my new Agent app</button>
<div id="sendMsg"></div>
<button class="secondary" id="dlBtn" hidden>Download a backup file too</button>
<p class="muted">This page only reads the copy of your clients that the old app saved in this phone's browser. Nothing here is deleted. Do this on every phone or computer you used the old app on.</p>
</main>
<script>
(function(){
  const KEYS=['customer-contacts:v1','customer-contacts:pending','customer-contacts:owner','customer-contacts:cursor'];
  let raw={};KEYS.forEach(k=>{try{raw[k]=localStorage.getItem(k);}catch(e){raw[k]=null;}});
  let clients=[];try{clients=JSON.parse(raw['customer-contacts:v1']||'[]')||[];}catch(e){}
  const live=clients.filter(c=>!c.deleted);
  const TYPES={sales:'Sales (sellers)',purchase:'Purchase (buyers)',rental:'Rental (tenants / landlords)'};
  const f=document.getElementById('found');
  if(!live.length){f.innerHTML='<p class="err">No saved clients found in this browser.</p><p class="muted">Try the other phone or computer you used, and open this page in the same browser you used for the old app (e.g. Chrome). If you added the old app to your home screen, open it from there and add <b>/rescue.html</b> to the address.</p>';return;}
  const by={};live.forEach(c=>{(by[c.type]=by[c.type]||[]).push(c);});
  f.innerHTML=`<div class="big">${live.length}</div><div>clients found on this device</div><ul>${Object.keys(by).map(t=>`<li>${TYPES[t]||t}: <b>${by[t].length}</b></li>`).join('')}</ul>
  <p class="muted" style="margin-top:10px">${live.slice(0,8).map(c=>(c.values&&c.values.name)||'No name').map(n=>n.replace(/[<&]/g,'')).join(', ')}${live.length>8?'…':''}</p>`;
  const payload=JSON.stringify({savedAt:new Date().toISOString(),device:navigator.userAgent,clients,raw});
  const dl=document.getElementById('dlBtn');dl.hidden=false;
  dl.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([payload],{type:'application/json'}));a.download='my-clients-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();setTimeout(()=>a.remove(),1000);};
  const send=document.getElementById('sendBtn'),msg=document.getElementById('sendMsg');send.hidden=false;
  send.onclick=async()=>{
    send.disabled=true;msg.innerHTML='<p class="muted">Copying…</p>';
    try{
      const r=await fetch('https://sereneleeproperty.com/agent/api/import',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:payload});
      if(r.status===401){msg.innerHTML='<p class="err">Sign in to your new Agent app first.</p><a class="btn secondary" href="https://sereneleeproperty.com/agent/" target="_blank" rel="noopener">Open Agent app to sign in</a><p class="muted">Then come back to this page and tap the gold button again.</p>';send.disabled=false;return;}
      const j=await r.json();
      if(!r.ok)throw new Error(j.error||r.status);
      msg.innerHTML=`<p class="ok">✓ ${j.saved} clients copied into your Agent app.</p><p class="muted">Keep this phone's copy until you've checked them there.</p>`;
    }catch(e){msg.innerHTML='<p class="err">Couldn\'t copy right now ('+String(e.message||e).replace(/[<&]/g,'')+'). Tap "Download a backup file" and send the file to Claude instead.</p>';send.disabled=false;}
  };
})();
</script></body></html>
