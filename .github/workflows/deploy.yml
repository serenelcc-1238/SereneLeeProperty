name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history: sitemap lastmod dates come from git
      - name: Rebuild town pages from the latest data
        run: python3 scripts/build_town_pages.py && python3 scripts/add_schema.py
      - name: Rebuild sitemap (picks up new pages automatically)
        run: python3 scripts/build_sitemap.py
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - name: Deploy to Cloudflare
        run: |
          set -o pipefail
          if ! npx wrangler deploy 2>&1 | tee deploy-out.txt; then
            # Surface the reason as an annotation so it is readable without opening the full log
            echo "::error title=Wrangler deploy failed::$(grep -v '^\s*$' deploy-out.txt | tail -n 15 | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
