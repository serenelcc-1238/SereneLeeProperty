name: Temp - check live pages
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          a=$(curl -s -o /dev/null -w "%{http_code}" https://app.sereneleeproperty.com/rescue.html); b=$(curl -s https://app.sereneleeproperty.com/rescue.html | grep -o "<title>[^<]*"); c=$(curl -s -o /dev/null -w "%{http_code}" https://app.sereneleeproperty.com/); d=$(curl -s https://sereneleeproperty.com/agent/ | grep -o "<title>[^<]*"); e=$(curl -s -i -X OPTIONS -H "Origin: https://app.sereneleeproperty.com" https://sereneleeproperty.com/agent/api/import | grep -i "access-control-allow-origin" | tr -d '\r')
          echo "::notice::rescue=$a $b | app=$c | agent=$d | cors=$e"
