name: Update HDB block info

# 2nd of each month, 6:23am Singapore time (1st, 22:23 UTC). Also runs on demand ("Run workflow").
on:
  schedule:
    - cron: "23 22 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-commits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pull HDB Property Information
        run: python scripts/update_block_info.py || [ $? -eq 2 ]
      - name: Save to the repo
        run: |
          git config user.name "block-info-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hdb-blocks.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Monthly HDB block info refresh"
          git pull --rebase origin main
          git push
