name: Update Instagram feed

# Every day 9:23pm Singapore time (13:23 UTC), after the 8:30pm Tue/Thu/Sun posting slots.
# Also runs on demand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-commits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull Instagram posts sent by Buffer
        id: fetch
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          set +e
          python scripts/update_instagram.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then exit 1; fi
          exit 0

      - name: Save to the repo
        id: commit
        run: |
          git config user.name "instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/instagram.json assets/ig/feed
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new posts."
          else
            git commit -m "Instagram feed refresh (from Buffer)"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.commit.outputs.changed == 'true'
        with:
          node-version: 20
      - name: Deploy site
        if: steps.commit.outputs.changed == 'true'
        run: |
          npm install
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Flag missing Buffer key
        if: steps.fetch.outputs.code == '3'
        run: |
          echo "BUFFER_API_KEY is not set, so new Instagram posts were not picked up. Add it under Settings > Secrets and variables > Actions."
          exit 1
