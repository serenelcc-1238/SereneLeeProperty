name: Update Instagram feed

# Runs whenever data/instagram.json changes (the "Website IG Sync" Claude task adds
# newly sent Buffer posts to it), and on demand from the Actions tab.
# Saves each post's image into assets/ig/feed/ and redeploys the site.
on:
  push:
    branches: [main]
    paths: ["data/instagram.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-commits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull Instagram posts sent by Buffer
        id: fetch
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          set +e
          python scripts/update_instagram.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then exit 1; fi   # 3 = no Buffer key: images-only mode, which is the normal case
          exit 0

      - name: Save to the repo
        id: commit
        run: |
          git config user.name "instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/instagram.json assets/ig/feed
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new posts."
          else
            git commit -m "Instagram feed refresh (from Buffer)"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.commit.outputs.changed == 'true'
        with:
          node-version: 20
      - name: Deploy site
        if: steps.commit.outputs.changed == 'true'
        run: |
          npm install
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
