name: Temp - recover old agent app
on: workflow_dispatch
permissions:
  contents: write
jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - name: Download the my-contacts worker and the live app files
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p out/site
          curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACC/workers/scripts/my-contacts/content/v2" -o out/worker-content.bin -w "worker content: %{http_code}\n" || true
          curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACC/workers/scripts/my-contacts/settings" -o out/worker-settings.json -w "settings: %{http_code}\n" || true
          curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACC/workers/scripts/my-contacts/content" -o out/worker-content-v1.bin -w "worker content v1: %{http_code}\n" || true
          curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACC/workers/domains" -o out/domains.json -w "domains: %{http_code}\n" || true
          cd out/site
          curl -sL -A "Mozilla/5.0" https://app.sereneleeproperty.com/ -o index.html -w "app index: %{http_code} %{size_download}\n" || true
          for u in $(grep -oE '(src|href)="[^"#]+\.(js|css|json|webmanifest)[^"]*"' index.html | sed -E 's/^(src|href)="//; s/"$//' | sort -u); do
            case "$u" in http*) url="$u";; /*) url="https://app.sereneleeproperty.com$u";; *) url="https://app.sereneleeproperty.com/$u";; esac
            f=$(echo "$u" | sed 's#[^A-Za-z0-9._-]#_#g'); curl -sL -A "Mozilla/5.0" "$url" -o "$f" -w "$u: %{http_code} %{size_download}\n" || true
          done
          ls -la
      - name: Encrypt and save to a temporary branch (only Claude's one-time key can open it)
        run: |
          cat > pub.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAwxZ3ti5R4wMkBp6r0zlR
          mBXzIoXQp2vGFZ7avCnsFmKhbKcNTDQo1shj7aND0GQq0qZVewdB/bSb2NdH0MSk
          9EzjZjmC3nMor35t7DZNsEwwLI9oWN+nhzpE3RwkWQ+hvXEeNh2bjlFH2WXoRs6V
          44fP7k/zwjjeT1eCSYg6LYu8qYo2Du+Egwu4EzvktqvwrC24ue1doe7jTspE37bl
          Kjefw54Q8XyAt9mYzkslSGWyaUOBExq5NAjRSsbxZkOfOFWv+t9tVCgTHD4IHEXC
          T41+THMCjHJgy0YRomNvHomVCj2zvhsBWGkhk7/EiAsVx+/mRsVDNkoxfP5O11it
          stZnG3zhOQmKEMvLPYbzcI1HlLxxp61XTq5gZ6knh0xAFKwWIAbxorxIe4PbxcYw
          h3kfe2BEr2Vo3YlGwDWgAWM3opE24v+T+AvzdvLvkZzj0oUotjuBW+UJ88mWDsv1
          Pvh4DCsuxcggjUN/WzW+KuhMvaPng84HAS8lxCcRZt1LAgMBAAE=
          -----END PUBLIC KEY-----
          KEY
          tar czf bundle.tgz out
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in bundle.tgz -out bundle.enc -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -in k.bin -out k.enc
          rm k.bin bundle.tgz
          git config user.name "recover-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan tmp-recover
          git rm -rfq --cached . >/dev/null
          git add -f bundle.enc k.enc
          git commit -qm "temp encrypted bundle"
          git push -f origin tmp-recover
