name: Update ERA articles

# Every Monday 7:13am Singapore time (Sunday 23:13 UTC), after the new launches refresh.
# Also runs on demand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "13 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-commits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull ERA research, insights and press releases
        id: fetch
        run: |
          set +e
          python scripts/update_era_articles.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then exit 1; fi
          exit 0

      - name: Save to the repo
        id: commit
        run: |
          git config user.name "era-articles-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog.html index.html data/era-articles.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in articles."
          else
            git commit -m "Weekly ERA articles refresh"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made by this workflow does not trigger deploy.yml, so deploy here.
      - uses: actions/setup-node@v4
        if: steps.commit.outputs.changed == 'true'
        with:
          node-version: 20
      - name: Deploy site
        if: steps.commit.outputs.changed == 'true'
        run: |
          npm install
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Flag a partial refresh
        if: steps.fetch.outputs.code == '2'
        run: |
          echo "One ERA category returned nothing this week. Check the fetch step log."
          exit 1
