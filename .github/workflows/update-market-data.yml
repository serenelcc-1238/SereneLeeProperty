name: Update market data

# Every Monday 6:13am Singapore time (Sunday 22:13 UTC).
# Also runs on demand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "13 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-commits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: sitemap lastmod dates come from git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch HDB and URA data
        id: fetch
        env:
          URA_ACCESS_KEY: ${{ secrets.URA_ACCESS_KEY }}
        run: |
          set +e
          python scripts/update_market_data.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then exit 1; fi
          exit 0

      - name: Refresh HDB median rents (new quarter about 4 weeks after it ends)
        run: python scripts/update_rents.py || echo "Rents not refreshed this week; last quarter's figures kept."

      - name: Rebuild town pages
        run: python3 scripts/build_town_pages.py && python3 scripts/add_schema.py

      - name: Save data to the repo
        id: commit
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data *.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in data."
          else
            git commit -m "Weekly market data refresh"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made by this workflow does not trigger deploy.yml, so deploy here.
      - uses: actions/setup-node@v4
        if: steps.commit.outputs.changed == 'true'
        with:
          node-version: 22
      - name: Deploy site
        if: steps.commit.outputs.changed == 'true'
        run: |
          npm install
          python3 scripts/build_sitemap.py
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Flag a partial refresh
        if: steps.fetch.outputs.code == '2'
        run: |
          echo "One data source did not refresh. The site kept last week's figures for it. Check the 'Fetch HDB and URA data' step log."
          exit 1
