name: Update new launches

# Every Monday 6:43am Singapore time (Sunday 22:43 UTC), after the market data refresh.
# Also runs on demand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "43 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-commits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull ERA new launch listings and rewrite the pages
        run: python scripts/update_new_launches.py

      - name: Save to the repo
        id: commit
        run: |
          git config user.name "new-launches-bot"
          git config user.email "actions@users.noreply.github.com"
          git add new-launches.html index.html data/new-launches.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in listings."
          else
            git commit -m "Weekly new launches refresh (ERA listings)"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made by this workflow does not trigger deploy.yml, so deploy here.
      - uses: actions/setup-node@v4
        if: steps.commit.outputs.changed == 'true'
        with:
          node-version: 20
      - name: Deploy site
        if: steps.commit.outputs.changed == 'true'
        run: |
          npm install
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
